name: Build Android App

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-android-app:
    runs-on: macos-latest # or ubuntu-latest with KVM enabled
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Build Android APK (Gradle)
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
        working-directory: android

      - name: Wait for Emulator to Boot
        run: |
          adb wait-for-device
          BOOT_COMPLETED=""
          TIMEOUT=300
          COUNTER=0
          
          while [ "$BOOT_COMPLETED" != "1" ]; do
            if [ $COUNTER -gt $TIMEOUT ]; then
              echo "Timeout waiting for emulator to boot."
              exit 1
            fi
            sleep 2
            BOOT_COMPLETED=$(adb shell getprop sys.boot_completed | tr -d '\r')
            COUNTER=$((COUNTER + 2))
          done
          echo "Emulator is fully booted!"

      - name: Run Android Emulator and Execute Script
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          script: |
            # Wait for device to be fully booted
            adb wait-for-device
            
            # Install your SDL3 APK
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            
            # Launch your SDL3 activity (replace with your package and activity name)
            adb shell am start -n "com.example.sdl3app/.MainActivity"
            
            # Wait a few seconds for the SDL3 surface/renderer to render frames
            sleep 5
            
            # Capture screenshot inside the emulator
            adb shell screencap -p /sdcard/screenshot.png
            
            # Pull the screenshot out to the GitHub Actions workspace
            adb pull /sdcard/screenshot.png ./screenshot.png

      - name: Upload Screenshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshot
          path: screenshot.png
