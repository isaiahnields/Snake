name: Build Android apps

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-android-apps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [21, 23, 29]
        target: [default, google_apis]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build Android APK (Gradle)
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
        working-directory: android

      - name: Run Android Emulator and Execute Script
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_7_pro
          script: |
            # 1. Force a clean environment check
            echo "Starting ADB Server..."
            /usr/local/lib/android/sdk/platform-tools/adb kill-server
            /usr/local/lib/android/sdk/platform-tools/adb start-server
            
            # 2. Block until the ADB bridge says the emulator is online (prevents device offline errors)
            echo "Waiting for ADB hardware bridge..."
            /usr/local/lib/android/sdk/platform-tools/adb wait-for-device
            
            # 3. Safely loop until Android completes its boot cycle
            echo "Waiting for Android OS to complete boot..."

            until [ "$( /usr/local/lib/android/sdk/platform-tools/adb shell getprop sys.boot_completed | tr -d '\r' )" = "1" ]; do echo "Waiting for emulator to boot..."; sleep 2; done
            
            echo "Emulator is completely ready!"
            
            # Install your SDL3 APK
            /usr/local/lib/android/sdk/platform-tools/adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            
            # Launch your SDL3 activity (replace with your package and activity name)
            /usr/local/lib/android/sdk/platform-tools/adb shell am start -n "com.isaiahnields.snake/.MainActivity"
            
            # Wait a few seconds for the SDL3 surface/renderer to render frames
            sleep 5
            
            # Capture screenshot inside the emulator
            /usr/local/lib/android/sdk/platform-tools/adb shell screencap -p > ../screenshot.png
            
            # Pull the screenshot out to the GitHub Actions workspace
            /usr/local/lib/android/sdk/platform-tools/adb pull /sdcard/screenshot.png ../screenshot.png

      - name: Upload Screenshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshot
          path: screenshot.png
