# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake desktop apps
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  cmake-dekstop-apps:
    name: CMake ${{ matrix.os }} app [C compiler = ${{ matrix.c_compiler }}, C++ compiler = ${{ matrix.cpp_compiler }}]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        cpp_compiler: [g++, clang++, cl]
        exclude:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: cl
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: cl
            cpp_compiler: clang++
          - os: ubuntu-latest
            c_compiler: cl
            cpp_compiler: cl

          - os: macos-latest
            c_compiler: gcc
            cpp_compiler: cl
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: cl
          - os: macos-latest
            c_compiler: cl
            cpp_compiler: g++
          - os: macos-latest
            c_compiler: cl
            cpp_compiler: clang++
          - os: macos-latest
            c_compiler: cl
            cpp_compiler: cl


    steps:
    - uses: actions/checkout@v7

    - name: Install SDL
      shell: bash
      run: git clone https://github.com/libsdl-org/SDL.git vendored/SDL

    - name: Install Build Dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo add-apt-repository universe
        sudo apt update
        sudo apt-get update
        sudo apt-get upgrade
        sudo apt-get install -y build-essential
        sudo apt-get install -y git
        sudo apt-get install -y gnome-desktop-testing
        sudo apt-get install -y ninja-build
        sudo apt-get install -y pkg-config
        sudo apt-get install -y make
        sudo apt-get install -y cmake
        sudo apt-get install -y libasound2-dev
        sudo apt-get install -y libpulse-dev
        sudo apt-get install -y libaudio-dev
        sudo apt-get install -y libfribidi-dev
        sudo apt-get install -y libjack-dev
        sudo apt-get install -y libsndio-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
          libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev \
          libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev \
          libthai-dev libusb-1.0-0-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      # --- UBUNTU / LINUX: Use Xvfb to run GUI and capture screenshot ---
    - name: Run GUI & Capture Screenshot (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y xvfb scrot x11-utils

        ready_file="$RUNNER_TEMP/snake-ui-ready.txt"
        screenshot_path="screenshot--${{ matrix.os }}--${{ matrix.c_compiler }}--${{ matrix.cpp_compiler }}.png"
        rm -f "$ready_file"

        Xvfb :99 -screen 0 1280x1024x24 &
        xvfb_pid=$!
        app_pid=""
        trap 'if [[ -n "$app_pid" ]]; then kill "$app_pid" 2>/dev/null || true; fi; kill "$xvfb_pid" 2>/dev/null || true' EXIT
        export DISPLAY=:99

        deadline=$((SECONDS + 30))
        until xdpyinfo -display "$DISPLAY" >/dev/null 2>&1; do
          if ! kill -0 "$xvfb_pid" 2>/dev/null; then
            echo "Xvfb exited before its display became available" >&2
            exit 1
          fi
          if (( SECONDS >= deadline )); then
            echo "Xvfb display did not become available within 30 seconds" >&2
            exit 1
          fi
          sleep 0.5
        done

        ./build/Release/snake --ready-file="$ready_file" &
        app_pid=$!
        deadline=$((SECONDS + 60))
        while [[ ! -f "$ready_file" ]]; do
          if ! kill -0 "$app_pid" 2>/dev/null; then
            wait "$app_pid" || true
            echo "Snake exited before rendering its initial menu" >&2
            exit 1
          fi
          if (( SECONDS >= deadline )); then
            echo "Snake did not render its initial menu within 60 seconds" >&2
            exit 1
          fi
          sleep 0.5
        done

        sleep 2
        scrot -o "$screenshot_path"
        test -s "$screenshot_path"

      # --- MACOS: Run GUI and capture screenshot ---
    - name: Run GUI & Capture Screenshot (macOS)
      if: runner.os == 'macOS'
      run: |
        set -euo pipefail
        ready_file="$RUNNER_TEMP/snake-ui-ready.txt"
        screenshot_path="screenshot--${{ matrix.os }}--${{ matrix.c_compiler }}--${{ matrix.cpp_compiler }}.png"
        rm -f "$ready_file"

        ./build/Release/snake --ready-file="$ready_file" &
        app_pid=$!
        trap 'kill "$app_pid" 2>/dev/null || true' EXIT

        deadline=$((SECONDS + 60))
        while [[ ! -f "$ready_file" ]]; do
          if ! kill -0 "$app_pid" 2>/dev/null; then
            wait "$app_pid" || true
            echo "Snake exited before rendering its initial menu" >&2
            exit 1
          fi
          if (( SECONDS >= deadline )); then
            echo "Snake did not render its initial menu within 60 seconds" >&2
            exit 1
          fi
          sleep 0.5
        done

        sleep 2
        screencapture -x "$screenshot_path"
        test -s "$screenshot_path"
          
      # --- WINDOWS: Run GUI and capture screenshot (using PowerShell/.NET or tool) ---      
    - name: Run GUI & Capture Screenshot (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $exe = Join-Path "${{ github.workspace }}" "build\Release\snake.exe"
        if (-not (Test-Path $exe)) {
          throw "Executable not found: $exe"
        }
        
        $readyFile = Join-Path $env:RUNNER_TEMP "snake-ui-ready.txt"
        Remove-Item -LiteralPath $readyFile -ErrorAction SilentlyContinue
        $process = Start-Process -FilePath $exe -ArgumentList "--ready-file=$readyFile" -PassThru
        $startupDeadline = [DateTime]::UtcNow.AddSeconds(60)
        do {
          $process.Refresh()
          if ($process.HasExited) {
            throw "Snake exited during startup with code $($process.ExitCode)"
          }
          if (Test-Path -LiteralPath $readyFile) {
            break
          }
          Start-Sleep -Milliseconds 500
        } while ([DateTime]::UtcNow -lt $startupDeadline)

        if (-not (Test-Path -LiteralPath $readyFile)) {
          throw "Snake did not render its initial menu within 60 seconds"
        }

        Start-Sleep -Seconds 2

        Add-Type -AssemblyName System.Drawing
        Add-Type -AssemblyName System.Windows.Forms

        $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
        $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
        $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
        $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)

        $screenshotPath = Join-Path "${{ github.workspace }}" "screenshot--${{ matrix.os }}--${{ matrix.c_compiler }}--${{ matrix.cpp_compiler }}.png"
        $bitmap.Save($screenshotPath, [System.Drawing.Imaging.ImageFormat]::Png)

        $graphics.Dispose()
        $bitmap.Dispose()

        if (Test-Path $screenshotPath) {
          Write-Host "Screenshot captured successfully: $screenshotPath"
        } else {
          throw "Screenshot capture failed"
        }

      # --- Upload Screenshots as Artifacts ---
    - name: Upload Screenshots
      uses: actions/upload-artifact@v7
      with:
        archive: false
        path: screenshot--${{ matrix.os }}--${{ matrix.c_compiler }}--${{ matrix.cpp_compiler }}.png
