# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        cpp_compiler: [g++, clang++, cl]
        exclude:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: cl
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: cl
            cpp_compiler: clang++
          - os: ubuntu-latest
            c_compiler: cl
            cpp_compiler: cl

          - os: macos-latest
            c_compiler: gcc
            cpp_compiler: cl
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: cl
          - os: macos-latest
            c_compiler: cl
            cpp_compiler: g++
          - os: macos-latest
            c_compiler: cl
            cpp_compiler: clang++
          - os: macos-latest
            c_compiler: cl
            cpp_compiler: cl


    steps:
    - uses: actions/checkout@v7

    - name: Install SDL
      shell: bash
      run: git clone https://github.com/libsdl-org/SDL.git vendored/SDL

    - name: Install Build Dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo add-apt-repository universe
        sudo apt update
        sudo apt-get update
        sudo apt-get upgrade
        sudo apt-get install -y build-essential
        sudo apt-get install -y git
        sudo apt-get install -y gnome-desktop-testing
        sudo apt-get install -y ninja-build
        sudo apt-get install -y pkg-config
        sudo apt-get install -y make
        sudo apt-get install -y cmake
        sudo apt-get install -y libasound2-dev
        sudo apt-get install -y libpulse-dev
        sudo apt-get install -y libaudio-dev
        sudo apt-get install -y libfribidi-dev
        sudo apt-get install -y libjack-dev
        sudo apt-get install -y libsndio-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
          libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev \
          libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev \
          libthai-dev libusb-1.0-0-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      # --- UBUNTU / LINUX: Use Xvfb to run GUI and capture screenshot ---
    - name: Run GUI & Capture Screenshot (Ubuntu)
      if: runner.os == 'Linux'
      run: |
          sudo apt-get update
          sudo apt-get install -y xvfb scrot imagemagick
          Xvfb :99 -screen 0 1024x768x24 &
          export DISPLAY=:99
          # Run your program in the background
          ./build/snake &
          sleep 10
          scrot screenshot--${{ matrix.os }}--${{ matrix.c_compiler }}--${{ matrix.cpp_compiler }}.png

      # --- MACOS: Run GUI and capture screenshot ---
    - name: Run GUI & Capture Screenshot (macOS)
      if: runner.os == 'macOS'
      run: |
          # Launch app in background (adjust path to your executable)
          ./build/Snake.app/Contents/MacOS/Snake &
          sleep 10
          # Capture main screen using screencapture
          screencapture -x screenshot--${{ matrix.os }}--${{ matrix.c_compiler }}--${{ matrix.cpp_compiler }}.png
          
      # --- WINDOWS: Run GUI and capture screenshot (using PowerShell/.NET or tool) ---
    - name: Run GUI & Capture Screenshot (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Download and place Mesa software rasterizer (opengl32.dll) in the same directory as your executable
        Invoke-WebRequest -Uri "https://github.com" -OutFile "mesa.7z"
        # (Extract the opengl32.dll file using 7z or Expand-Archive and copy it to .\build\Release\)

        # Start your process safely
        $process = Start-Process -FilePath ".\build\Release\snake.exe" -PassThru
        
        # Instead of sleep, loop until the Window Handle is generated and active
        while ($process.MainWindowHandle -eq 0) { Start-Sleep -m 500 }
        Start-Sleep -s 5 # Additional buffer time for initial frames to complete
        
        # Capture screen via forms
        Add-Type -AssemblyName System.Windows.Forms
        Add-Type -AssemblyName System.Drawing
        $Screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
        $Bitmap = New-Object System.Drawing.Bitmap $Screen.Width, $Screen.Height
        $Graphics = [System.Drawing.Graphics]::FromImage($Bitmap)
        $Graphics.CopyFromScreen($Screen.Location, [System.Drawing.Point]::Empty, $Screen.Size)
        $Bitmap.Save("$PWD\screenshot--${{ matrix.os }}--${{ matrix.c_compiler }}--${{ matrix.cpp_compiler }}.png")
        
        # Clean up
        $Graphics.Dispose()
        $Bitmap.Dispose()
        Stop-Process -Id $process.Id -Force

      # --- Upload Screenshots as Artifacts ---
    - name: Upload Screenshots
      uses: actions/upload-artifact@v7
      with:
        archive: false
        path: screenshot-${{ matrix.os }}-${{ matrix.c_compiler }}-${{ matrix.cpp_compiler }}.png

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --build-config ${{ matrix.build_type }}
