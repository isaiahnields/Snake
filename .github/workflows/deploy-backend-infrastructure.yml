name: Deploy backend infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-backend-infrastructure.yml'
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-backend-infrastructure.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TERRAFORM_VERSION: '1.16.5'
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_VAR_aws_region: us-west-2

jobs:
  config:
    name: Load configuration
    runs-on: ubuntu-latest
    outputs:
      apply_role_arn: arn:aws:iam::688019016509:role/snake-terraform-apply
      aws_region: us-west-2
      plan_role_arn: arn:aws:iam::688019016509:role/snake-terraform-plan
      state_bucket: snake-terraform-state-688019016509-us-west-2
    steps:
      - run: echo "Exposing hardcoded configuration as job outputs."

  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform -chdir=infra fmt -check -recursive -diff

      - name: Validate bootstrap stack
        run: |
          terraform -chdir=infra/bootstrap init -backend=false
          terraform -chdir=infra/bootstrap validate

      - name: Validate backend stack
        run: |
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate

  plan:
    name: Plan
    needs: [config, validate]
    # Fork pull requests cannot request OIDC tokens.
    if: >-
      needs.config.outputs.plan_role_arn != '' && needs.config.outputs.state_bucket != '' &&
      needs.config.outputs.aws_region != '' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ needs.config.outputs.plan_role_arn }}
          aws-region: ${{ needs.config.outputs.aws_region }}
          audience: sts.amazonaws.com

      - name: Terraform init
        run: >
          terraform init
          -backend-config="bucket=${{ needs.config.outputs.state_bucket }}"
          -backend-config="region=${{ needs.config.outputs.aws_region }}"

      # Plans never write state, so the read-only plan role skips locking.
      - name: Terraform plan
        run: terraform plan -lock=false -out=tfplan

      - name: Publish plan summary
        if: always()
        run: |
          if [ ! -f tfplan ]; then exit 0; fi
          {
            echo '## Terraform plan'
            echo '```'
            terraform show -no-color tfplan | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply
    needs: [config, plan]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.config.outputs.apply_role_arn != ''
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment to gate applies.
    environment: production
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ needs.config.outputs.apply_role_arn }}
          aws-region: ${{ needs.config.outputs.aws_region }}
          role-duration-seconds: 7200

      - name: Terraform init
        run: >
          terraform init
          -backend-config="bucket=${{ needs.config.outputs.state_bucket }}"
          -backend-config="region=${{ needs.config.outputs.aws_region }}"

      - name: Terraform plan
        run: terraform plan -lock-timeout=10m -out=tfplan

      # Creating a GameLift fleet waits for it to activate, which can take over an hour.
      - name: Terraform apply
        timeout-minutes: 110
        run: terraform apply -lock-timeout=10m tfplan

      - name: Publish outputs
        run: |
          {
            echo '## Backend outputs'
            echo '```json'
            terraform output -json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
