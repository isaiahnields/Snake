name: Deploy backend infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-backend-infrastructure.yml'
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-backend-infrastructure.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TERRAFORM_VERSION: '1.16.5'
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform -chdir=infra fmt -check -recursive -diff

      - name: Validate bootstrap stack
        run: |
          terraform -chdir=infra/bootstrap init -backend=false
          terraform -chdir=infra/bootstrap validate

      - name: Validate backend stack
        run: |
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate

      - name: Report missing AWS configuration
        if: vars.AWS_PLAN_ROLE_ARN == '' || vars.AWS_APPLY_ROLE_ARN == '' || vars.TF_STATE_BUCKET == '' || vars.AWS_REGION == ''
        run: >
          echo "::notice::Plan and apply are skipped until the AWS_REGION, TF_STATE_BUCKET,
          AWS_PLAN_ROLE_ARN and AWS_APPLY_ROLE_ARN repository variables are set. See infra/README.md."

  plan:
    name: Plan
    needs: validate
    # Fork pull requests cannot request OIDC tokens.
    if: >-
      vars.AWS_PLAN_ROLE_ARN != '' && vars.TF_STATE_BUCKET != '' && vars.AWS_REGION != '' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        run: >
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      # Plans never write state, so the read-only plan role skips locking.
      - name: Terraform plan
        run: terraform plan -lock=false -out=tfplan

      - name: Publish plan summary
        if: always()
        run: |
          if [ ! -f tfplan ]; then exit 0; fi
          {
            echo '## Terraform plan'
            echo '```'
            terraform show -no-color tfplan | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_APPLY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment to gate applies.
    environment: production
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 7200

      - name: Terraform init
        run: >
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform plan
        run: terraform plan -lock-timeout=10m -out=tfplan

      # Creating a GameLift fleet waits for it to activate, which can take over an hour.
      - name: Terraform apply
        timeout-minutes: 110
        run: terraform apply -lock-timeout=10m tfplan

      - name: Publish outputs
        run: |
          {
            echo '## Backend outputs'
            echo '```json'
            terraform output -json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
