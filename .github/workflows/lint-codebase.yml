name: Lint codebase

on:
  pull_request:
  workflow_dispatch:

jobs:
  lint-codebase:
    name: Lint codebase on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'cmdline-tools;latest platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install native lint tools
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt update
            sudo apt-get upgrade
            sudo apt install --yes clang-tidy libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxss-dev libwayland-dev libxkbcommon-dev libxtst-dev
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            choco install llvm --yes --no-progress
            echo 'C:\Program Files\LLVM\bin' >> "$GITHUB_PATH"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install llvm
            echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          fi
          python -m pip install clang-format==23.1.3

      - name: Lint codebase
        shell: bash
        run: bash scripts/lint-codebase.sh
