name: Lint codebase

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint-codebase:
    name: Lint codebase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'cmdline-tools;latest platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install native lint tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-tidy
          python -m pip install clang-format==23.1.3

      - name: Check C++ formatting
        run: git ls-files -z -- '*.cpp' '*.h' | xargs -0 clang-format --dry-run --Werror

      - name: Configure native lint
        run: cmake -S . -B build-lint -DCMAKE_BUILD_TYPE=Debug -DSNAKE_ENABLE_CLANG_TIDY=ON

      - name: Build and lint native code
        run: cmake --build build-lint --parallel

      - name: Lint Android code
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon lintDebug
