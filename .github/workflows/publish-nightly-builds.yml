name: Publish nightly builds
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  create-nightly-builds:
    name: Publish nightly ${{ matrix.os }} build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: snake-nightly-ubuntu
            executable: build/Release/snake
          - os: windows-latest
            artifact: snake-nightly-windows
            executable: build/Release/snake.exe
          - os: macos-latest
            artifact: snake-nightly-macos
            executable: build/Release/snake
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install SDL
        shell: bash
        run: git clone https://github.com/libsdl-org/SDL.git vendored/SDL

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=OFF -DSDL_STATIC=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run unit tests
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

      - name: Package executable
        run: cmake -E tar czf ${{ matrix.artifact }}.tar.gz --format=gnutar -- ${{ matrix.executable }}

      - name: Upload nightly build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
          retention-days: 14
          archive: false
  publish-nightly-release:
    name: Publish nightly release
    needs: create-nightly-builds
    runs-on: ubuntu-latest
    steps:
      - name: Download nightly builds
        uses: actions/download-artifact@v8
        with:
          pattern: snake-nightly-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly-${{ github.run_id }}-${{ github.run_attempt }}
          name: Nightly builds v${{ github.run_number }}.${{ github.run_attempt }}
          prerelease: true
          files: ./*.tar.gz
