name: Publish nightly release
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  create-nightly-desktop-builds:
    name: Cretate nightly ${{ matrix.os }} build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: snake-nightly-ubuntu
            executable: build/Release/snake
          - os: windows-latest
            artifact: snake-nightly-windows
            executable: build/Release/snake.exe
          - os: macos-latest
            artifact: snake-nightly-macos
            executable: build/Release/snake
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install SDL
        shell: bash
        run: git clone https://github.com/libsdl-org/SDL.git vendored/SDL

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=OFF -DSDL_STATIC=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run unit tests
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

      - name: Package executable
        run: cmake -E tar czf ${{ matrix.artifact }}.tar.gz --format=gnutar -- ${{ matrix.executable }}

      - name: Upload nightly build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
          retention-days: 14
          archive: false

  create-nightly-android-apk:
    name: Create nightly Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: android

      - name: Lint
        run: ./gradlew lintDebug
        working-directory: android

      - name: Build APK
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Package APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk snake-nightly-android.apk

      - name: Upload nightly APK
        uses: actions/upload-artifact@v7
        with:
          name: snake-nightly-android
          path: snake-nightly-android.apk
          if-no-files-found: error
          retention-days: 14
          archive: false

  publish-nightly-release:
    name: Publish nightly release
    needs: [create-nightly-desktop-builds, create-nightly-android-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Download nightly builds
        uses: actions/download-artifact@v8
        with:
          pattern: snake-nightly-*
          merge-multiple: true

      - name: Get current date
        id: date
        run: echo "now=$(date +'%Y/%m/%d')" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly-${{ github.run_id }}-${{ github.run_attempt }}
          name: Nightly Release - ${{ steps.date.outputs.now }}
          prerelease: true
          files: |
            ./*.tar.gz
            ./*.apk
