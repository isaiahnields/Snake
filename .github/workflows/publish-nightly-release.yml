name: Publish nightly release
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  create-nightly-desktop-builds:
    name: Cretate nightly ${{ matrix.os }} build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: snake-nightly-ubuntu
            executable: build/Release/snake
          - os: windows-latest
            artifact: snake-nightly-windows
            executable: build/Release/snake.exe
          - os: macos-latest
            artifact: snake-nightly-macos
            executable: build/Release/snake
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=OFF -DSDL_STATIC=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run unit tests
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

      - name: Package executable
        run: cmake -E tar czf ${{ matrix.artifact }}.tar.gz --format=gnutar -- ${{ matrix.executable }}

      - name: Upload nightly build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
          retention-days: 14
          archive: false

  create-nightly-android-apk:
    name: Create nightly Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: android

      - name: Clean build
        run: ./gradlew clean
        working-directory: android

      - name: Save version tag in env
        if: startsWith(github.ref, 'refs/tags/') && github.repository == 'isaiahnields/snake'
        run: |
          set -x
          echo "VERSION_TAG=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV

      - name: Clean build
        if: startsWith(github.ref, 'refs/tags/') && github.repository == 'isaiahnields/snake'
        run: ./gradlew clean
        working-directory: android

      - name: Add secrets to local.properties
        if: startsWith(github.ref, 'refs/tags/') && github.repository == 'isaiahnields/snake'
        run: touch local.properties # TODO: fill in properties file

      - name: Assemble release
        run: ./gradlew assembleRelease
        working-directory: android

      - name: Delete local.properties
        if: startsWith(github.ref, 'refs/tags/') && github.repository == 'isaiahnields/snake'
        run: |
          set -e
          rm local.properties

      - name: Prepare APKs with checksums, archive mapping.txt file (basic)
        if: startsWith(github.ref, 'refs/tags/') && github.repository == 'isaiahnields/snake'
        run: |
          set -e
          \android\app\build\outputs\apk\release
          mv android/app/build/outputs/apk/release/Snake-release.apk snake-nightly-android.apk
          sha256=`sha256sum snake-nightly-android.apk | awk '{ print $1 }'`
          echo "APK_UNIVERSAL_SHA256=$sha256" >> $GITHUB_ENV

  publish-nightly-release:
    name: Publish nightly release
    needs: [create-nightly-desktop-builds, create-nightly-android-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Download nightly builds
        uses: actions/download-artifact@v8
        with:
          pattern: snake-nightly-*
          merge-multiple: true

      - name: Get current date
        id: date
        run: echo "now=$(date +'%Y/%m/%d')" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly-${{ github.run_id }}-${{ github.run_attempt }}
          name: Nightly Release - ${{ steps.date.outputs.now }}
          prerelease: true
          files: |
            ./*.tar.gz
            ./*.apk
