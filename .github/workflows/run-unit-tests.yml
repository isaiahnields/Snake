name: Run unit tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  run-unit-tests:
    name: test_${{ matrix.test }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        test: [snake_game, neural_network, dqn_agent, renderer]
    steps:
      - uses: actions/checkout@v7

      - name: Install SDL
        shell: bash
        run: git clone https://github.com/libsdl-org/SDL.git vendored/SDL

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build test_${{ matrix.test }}
        run: cmake --build build --config Debug --target test_${{ matrix.test }}

      - name: Run ${{ matrix.test }} test
        run: ctest --test-dir build -C Debug -R "^${{ matrix.test }}$" --output-on-failure --no-tests=error
