plugins {
    id 'com.android.application'
}

android {
    namespace 'com.isaiahnields.snake' // Replace with your desired package name
    compileSdk 34

    defaultConfig {
        applicationId "com.isaiahnields.snake"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Configures the architectures built for testing
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        // Links your app to your CMakeLists.txt file
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Tells Gradle where to locate your C++ project script
    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt') // Ensure this accurately points to your CMakeLists.txt file
            version '3.22.1'
        }
    }

    // Required for SDL3 to pass its structural C/C++ dependencies (prefab) through the AAR
    buildFeatures {
        prefab true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Looks directly into your app/libs directory for any local .aar structures
    implementation fileTree(dir: 'libs', include: ['*.aar'])

    // Core Android app requirements
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
