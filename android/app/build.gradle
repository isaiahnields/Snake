plugins {
    id 'com.android.application'
}

android {
    namespace 'com.isaiahnields.snake'
    compileSdk 34

    defaultConfig {
        applicationId "com.isaiahnields.snake"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }

    // Required for SDL3 to pass its structural C/C++ dependencies (prefab) through the AAR
    buildFeatures {
        prefab true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def appName = "Snake"
            def versionName = variant.versionName
            def buildType = variant.buildType.name

            // Set the new name (e.g., MyApp-v1.0.0-release.apk)
            outputFileName = "${appName}-v${versionName}-${buildType}.apk"
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar'])

    implementation 'androidx.appcompat:appcompat:1.6.1'
}
